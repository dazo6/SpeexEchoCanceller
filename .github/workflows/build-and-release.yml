name: Build and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-package:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Qt and MinGW
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_mingw
          tools: tools_mingw1310,qt.tools.win64_mingw1310
          cache: true

      - name: Add the Qt MinGW toolchain to PATH
        shell: pwsh
        run: |
          $qtInstallRoot = Split-Path (Split-Path $env:QT_ROOT_DIR -Parent) -Parent
          $compiler = Get-ChildItem -LiteralPath $qtInstallRoot -Filter g++.exe -Recurse -File |
            Where-Object { $_.FullName -match '[\\/]mingw[^\\/]*[\\/]bin[\\/]g\+\+\.exe$' } |
            Select-Object -First 1
          if (-not $compiler) { throw 'Qt MinGW compiler was not found.' }
          $compilerBin = $compiler.Directory.FullName
          $compilerBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "MINGW_BIN=$compilerBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "MinGW Makefiles" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DCMAKE_C_COMPILER="$env:MINGW_BIN/gcc.exe" `
            -DCMAKE_CXX_COMPILER="$env:MINGW_BIN/g++.exe" `
            -DAEC_ENABLE_LOCAL_DEPLOY=OFF `
            -DREAL_AEC_CONFIG=Debug

      - name: Build
        run: cmake --build build --parallel 2

      - name: Package runtime
        shell: pwsh
        run: |
          ./scripts/package_release.ps1 `
            -BuildDir build `
            -OutputDir dist `
            -QtBinDir "$env:QT_ROOT_DIR/bin"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeexEchoCanceller-windows-x64
          path: dist/SpeexEchoCanceller-windows-x64.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            "dist/SpeexEchoCanceller-windows-x64.zip" `
            --verify-tag --generate-notes --title "$env:GITHUB_REF_NAME"
